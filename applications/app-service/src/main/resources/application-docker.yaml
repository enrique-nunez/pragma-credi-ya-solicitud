server:
  port: 8082

spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://db_solicitudes/crediyasolicitud}
    username: ${SPRING_R2DBC_USERNAME:crediya}
    password: ${SPRING_R2DBC_PASSWORD:crediya2025}
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

adapters:
  restuser:
    timeout: 5000
    url: ${ADAPTERS_RESTUSER_URL:http://autenticacion:8081}

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
  retry:
    instances:
      testGet:
        max-attempts: 3
        wait-duration: 1000
  timelimiter:
    instances:
      testGet:
        timeout-duration: 3000

cors:
  allowed-origins: "http://localhost:4200,http://autenticacion:8081,http://solicitudes:8082"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: "always"

logging:
  level:
    co.com.pragma: INFO
    org.springframework.r2dbc: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

application:
  name: "Pragma Loan Management API (Docker)"
  description: "API REST para administración de solicitudes de crédito con arquitectura reactiva usando Spring WebFlux y R2DBC con PostgreSQL. - Banco Colombia CrediYa (Containerized)"
  version: "1.0.0"
