services:
  postgres-solicitud:
    image: postgres:17
    container_name: dev-postgres-solicitud
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crediyasolicitud}
      POSTGRES_USER: ${POSTGRES_USER:-crediya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      TZ: America/Lima
    volumes:
      - pg_data_solicitud:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data_solicitud: